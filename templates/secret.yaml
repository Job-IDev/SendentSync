apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
data:
  DatabaseConfiguration__DatabaseType: {{ .Values.secrets.databaseType | b64enc | quote }}
  DatabaseConfiguration__DatabaseEncryptionKey: {{ .Values.secrets.databaseEncryptionKey | b64enc | quote }}
  DatabaseConfiguration__ConnectionString: {{ .Values.secrets.databaseConnectionString | b64enc | quote }}
  Service__NextcloudConfiguration__NextcloudBaseUrl: {{ .Values.secrets.nextcloudBaseUrl | b64enc | quote }}
  Service__NextcloudConfiguration__NextcloudServiceUsername: {{ .Values.secrets.nextcloudServiceUsername | b64enc | quote }}
  Service__NextcloudConfiguration__NextcloudServicePassword: {{ .Values.secrets.nextcloudServicePassword | b64enc | quote }}
  Service__NextcloudConfiguration__SharedSecret: {{ .Values.secrets.nextcloudSharedSecret | b64enc | quote }}
  Service__ExchangeConfiguration__ExchangeType: {{ .Values.secrets.exchangeType | b64enc | quote }}
  Service__ExchangeConfiguration__ExchangeOnPremUrl: {{ .Values.secrets.exchangeOnPremUrl | b64enc | quote }}
  Service__ExchangeConfiguration__ExchangeOnPremDomain: {{ .Values.secrets.exchangeOnPremDomain | b64enc | quote }}
  Service__ExchangeConfiguration__ExchangeOnPremAdfsAuthorityUrl: {{ .Values.secrets.exchangeOnPremAdfsAuthorityUrl | b64enc | quote }}
  Service__ExchangeConfiguration__ExchangeTenantId: {{ .Values.secrets.exchangeTenantId | b64enc | quote }}
  Service__ExchangeConfiguration__ExchangeAdminFile: {{ .Values.secrets.exchangeAdminFile | b64enc | quote }}