apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-env-file
type: Opaque
stringData:
  .env: |-
    Service__DeploymentType={{ .Values.config.deploymentType }}
    Service__DefaultWorkerName={{ .Values.config.defaultWorkerName }}
    Service__BatchLimit={{ .Values.config.batchLimit }}
    Service__WorkerIntervalSeconds={{ .Values.config.workerIntervalSeconds }}
    Service__SyncIntervalInSeconds={{ .Values.config.syncIntervalInSeconds }}
    Service__CriticalSyncIntervalInSeconds={{ .Values.config.criticalSyncIntervalInSeconds }}
    Service__BatchSaveSize={{ .Values.config.batchSaveSize }}
    Service__StartWeekend={{ .Values.config.startWeekend }}
    Service__SyncMode={{ .Values.config.syncMode }}
    Service__SyncType={{ .Values.config.syncType }}
    Service__ConcurrencyConfiguration__MaxParallelProcessingUsers={{ .Values.config.maxParallelProcessingUsers }}
    Service__ConcurrencyConfiguration__MaxUsersPerAdmin={{ .Values.config.maxUsersPerAdmin }}
    Service__FullSyncConfiguration__ProcessAttachments={{ .Values.config.fullSyncProcessAttachments }}
    Service__SensitiveSyncConfiguration__SensitiveTitle={{ .Values.config.sensitiveTitle }}
    Service__SensitiveSyncConfiguration__SensitiveCategory={{ .Values.config.sensitiveCategory }}
    Serilog__MinimumLevel__Default={{ .Values.config.serilogMinLevel }}
    Service__LoggingConfiguration__LogsOutput={{ .Values.config.logsOutput }}
    Service__LoggingConfiguration__LokiInternalUrl={{ .Values.config.lokiInternalUrl }}
    Service__LoggingConfiguration__LogFileSizeLimit={{ .Values.config.logFileSizeLimit }}
    Service__LoggingConfiguration__LogFileAmountLimit={{ .Values.config.logFileAmountLimit }}
    DatabaseConfiguration__DatabaseType={{ .Values.secrets.databaseType }}
    DatabaseConfiguration__DatabaseEncryptionKey={{ .Values.secrets.databaseEncryptionKey }}
    DatabaseConfiguration__ConnectionString={{ .Values.secrets.databaseConnectionString }}
    Service__NextcloudConfiguration__NextcloudBaseUrl={{ .Values.secrets.nextcloudBaseUrl }}
    Service__NextcloudConfiguration__NextcloudServiceUsername={{ .Values.secrets.nextcloudServiceUsername }}
    Service__NextcloudConfiguration__NextcloudServicePassword={{ .Values.secrets.nextcloudServicePassword }}
    Service__NextcloudConfiguration__SharedSecret={{ .Values.secrets.nextcloudSharedSecret }}
    Service__ExchangeConfiguration__ExchangeType={{ .Values.secrets.exchangeType }}
    Service__ExchangeConfiguration__ExchangeOnPremUrl={{ .Values.secrets.exchangeOnPremUrl }}
    Service__ExchangeConfiguration__ExchangeOnPremDomain={{ .Values.secrets.exchangeOnPremDomain }}
    Service__ExchangeConfiguration__ExchangeOnPremAdfsAuthorityUrl={{ .Values.secrets.exchangeOnPremAdfsAuthorityUrl }}
    Service__ExchangeConfiguration__ExchangeTenantId={{ .Values.secrets.exchangeTenantId }}
    Service__ExchangeConfiguration__ExchangeAdminFile={{ .Values.secrets.exchangeAdminFile }}